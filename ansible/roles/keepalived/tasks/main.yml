- name: Установить keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present

- name: Конфиг keepalived
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0644"
    validate: keepalived -t -f %s
  notify: Reload keepalived

- name: keepalived запущен и в автозагрузке
  ansible.builtin.service:
    name: keepalived
    state: started
    enabled: true
